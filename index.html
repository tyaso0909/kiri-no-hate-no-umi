    case 'deep':return `<div class="prompt">深海で見つけた宝箱<small>1個だけ持ち帰れます。</small></div>
      <div class="choices">${g.sub.opts.map((c,i)=>`<button class="btn ico-btn" data-a="deepPick" data-i="${i}" ${dis}><svg width="62" height="56" viewBox="0 0 62 56" aria-hidden="true">${chestOpen(c,1,1)}</svg>${c.v<0?'呪いの箱':`金貨${c.v}`}</button>`).join('')}</div>`;
    case 'chart':return `<div class="prompt">海図を読む：山札の上2枚<small>左が次に引かれるカード（次は ${esc(nm(g,(actor+1)%g.P.length))} の番）。</small></div>
      <div class="choices"><button class="btn" data-a="chart" data-swap="0" ${dis}>このまま戻す</button><button class="btn primary" data-a="chart" data-swap="1" ${dis}>入れ替えて戻す</button></div>
      <div class="cards"><div class="cardwrap"><span class="cap">1枚目（次に引かれる）</span>${cardHTML(g.deck[0],{small:true})}</div><div class="cardwrap"><span class="cap">2枚目</span>${cardHTML(g.deck[1],{small:true})}</div></div>`;
    case 'bet':return `<div class="prompt">賭けの酒場<small>偶数なら金貨+3、奇数なら金貨−2。いまの金貨は ${p.gold} 枚。</small></div>
      <div class="choices"><button class="btn primary" data-a="bet" data-roll="1" ${dis}>サイコロを振る</button><button class="btn" data-a="bet" data-roll="0" ${dis}>見送る</button></div>
      <div class="cards">${cardHTML(g.cur,{small:true})}</div>`;
  }
  return '';
}
let lastBell='',diceUntil=0,diceTimers=[];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DIE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function hideDice(){diceTimers.forEach(clearTimeout);diceTimers=[];const el=document.getElementById('dice');if(el){el.hidden=true;el.innerHTML=''}diceUntil=0}
/* サイコロの結果（航海日誌の行）から演出を出す。全員の画面で同じ目が出る */
function showDice(e){
  let v,who,title,head,res;const good=e.c==='good';
  if(e.dice){({v,title,head,res}=e.dice);who=e.t.slice(('サイコロは'+v+'。').length,e.t.length-res.length-1)}
  else{const m=/サイコロは(\d)。(.+?)は金貨([+−-]\d)（計(\d+)）/.exec(e.t);if(!m)return;v=+m[1];who=m[2];title='賭けの酒場';head=(v%2?'奇数':'偶数')+'！';res=`金貨${m[3]}（計${m[4]}枚）`}
  const el=document.getElementById('dice');if(!el)return;
  hideDice();
  const faces=[1,2,3,4,5,6].map(f=>`<div class="face f${f}">${[...Array(9)].map((_,k)=>PIPS[f].includes(k)?`<i class="${f===1?'red':''}"></i>`:'<span></span>').join('')}</div>`).join('');
  el.innerHTML=`<div class="dice-box" role="status" aria-live="polite"><div class="dice-who">${esc(who)}　${esc(title)}</div>
    <div class="dice-stage"><div class="die-wrap"><div class="die" id="die">${faces}</div></div></div><div class="dice-shadow" aria-hidden="true"></div>
    <div class="dice-res ${good?'good':'bad'}" id="dice-res">${v}の目　${esc(head)}<small>${esc(res)}</small></div></div>`;
  el.hidden=false;
  const die=document.getElementById('die'),[rx,ry]=DIE_ROT[v];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const resEl=document.getElementById('dice-res');
  if(reduce){die.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(0deg)`;resEl.classList.add('show')}
  else{
    die.style.transform=`rotateX(${rx-720-360*Math.floor(Math.random()*2)}deg) rotateY(${ry-1080+90*Math.floor(Math.random()*4)}deg) rotateZ(${-360+Math.round(Math.random()*120)}deg)`;
    void die.offsetWidth;die.classList.add('roll');die.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(0deg)`;
    diceTimers.push(setTimeout(()=>resEl.classList.add('show'),1350));
  }
  diceUntil=Date.now()+3000;
  diceTimers.push(setTimeout(hideDice,3000));
}
/* ---- 手番の知らせ・結果のパネル（順番に表示） ---- */
const ANN={q:[],cur:null,timer:null,until:0};
function annClear(){clearTimeout(ANN.timer);ANN.q=[];ANN.cur=null;ANN.until=0;const el=document.getElementById('ann');if(el){el.hidden=true;el.innerHTML=''}}
function annPush(it){
  ANN.q.push(it);if(ANN.q.length>5)ANN.q.splice(0,ANN.q.length-5);
  ANN.until=Math.max(ANN.until,Date.now(),diceUntil)+it.ms+200;
  if(!ANN.cur)annNext();
}
function annNext(){
  const el=document.getElementById('ann');if(!el)return;
  const it=ANN.q.shift();
  if(!it){ANN.cur=null;el.hidden=true;el.innerHTML='';return}
  ANN.cur=it;
  const wait=Math.max(0,diceUntil-Date.now());
  ANN.timer=setTimeout(()=>{
    el.className=it.cls;el.innerHTML=it.html;el.hidden=false;if(it.sound)SFX.play(it.sound);
    ANN.timer=setTimeout(()=>{el.classList.add('out');ANN.timer=setTimeout(annNext,180)},it.ms);
  },wait);
}
const ANN_SKIP=/アクションカードを引いた|^出航|^サイコロは|カードをキープ/;
const ANN_RANK={win:6,bad:5,cash:4,good:3,trick:2,sys:1,'':1};
function announceBatch(g,ne){
  const lines=ne.filter(e=>!ANN_SKIP.test(e.t)&&!/がもう一度行動する/.test(e.t));
  if(!lines.length)return;
  let actor=-1;
  for(const e of lines){const i=g.seats.findIndex(x=>e.t.startsWith(x.name));if(i>=0){actor=i;break}}
  const nmA=actor>=0?nm(g,actor):'';
  const strip=t=>actor>=0&&t.startsWith(nmA+'：')?t.slice(nmA.length+1):t;
  const shown=lines.slice(-4);
  const top=shown.reduce((a,e)=>ANN_RANK[e.c]>ANN_RANK[a]?e.c:a,'');
  annPush({cls:'ann res '+top,ms:Math.min(2300,1000+shown.length*330),
    html:`<div class="ann-box"><div class="ann-head">${actor>=0?pennant(SEATC[actor%4],22)+`<b>${esc(nmA)}</b>`:'<b>海の出来事</b>'}<small>ターン ${shown[0].tn??g.turnNo}</small></div><ul>${shown.map(e=>`<li class="${e.c}">${esc(strip(e.t))}</li>`).join('')}</ul></div>`});
}
function announceTurn(g,me){
  const t=g.turn,mine=t===me;
  annPush({cls:'ann turn'+(mine?' me':''),ms:mine?1100:750,sound:mine?'bell':null,
    html:`<div class="ann-box">${pennant(SEATC[t%4],34)}<div><div class="ann-title">${mine?'あなたの番です':esc(nm(g,t))+'の番'}</div><small>ターン ${g.turnNo}${g.seats[t].kind==='cpu'?'　CPU':''}</small></div></div>`});
}
let prevGold=[],deltas=[];
function deltaHTML(i){const d=deltas[i];if(!d)return '';const el=Date.now()-d.t0;if(el>2200)return '';return `<span class="delta ${d.v>0?'up':'down'}" style="animation-delay:-${el}ms">${d.v>0?'+':'−'}${Math.abs(d.v)}</span>`}
function trackGold(g,first){
  g.P.forEach((p,i)=>{if(!first&&prevGold[i]!==undefined&&prevGold[i]!==p.gold)deltas[i]={v:p.gold-prevGold[i],t0:Date.now()};prevGold[i]=p.gold});
  if(first)deltas=[];
}
let lastTurnKey='';
function renderGame(g){
  const me=mySeat(g);
  const order=me>=0?[...Array(g.P.length)].map((_,k)=>(me+1+k)%g.P.length).filter(i=>i!==me):idx(g);
  const fresh=g.log.length?g.log[g.log.length-1].n:0;
  const first=!lastLogN||fresh<lastLogN;
  trackGold(g,first);
  if(!first&&fresh>lastLogN){const ne=g.log.filter(e=>e.n>lastLogN);SFX.fromLog(ne);const de=ne.find(e=>e.t.startsWith('サイコロは'));if(de)showDice(de);announceBatch(g,ne)}
  const turnKey=g.turnNo+':'+g.turn;
  if(g.phase!=='over'&&turnKey!==lastTurnKey&&(!first||g.turnNo===1)){announceTurn(g,me)}
  lastTurnKey=turnKey;
  const logs=g.log.map(e=>`<li class="${e.c} ${e.n>lastLogN&&lastLogN?'fresh':''}"><span class="tn">${e.tn??''}</span><span class="tx">${esc(e.t)}</span></li>`).join('');
  const ol0=document.querySelector('.log ol');const prevScroll=ol0?ol0.scrollTop:null;
  $app.innerHTML=`<div class="screen-game">${CHART_BG}${topbar()}
  <div class="game">
    <div class="route">${routeHTML(g,me)}</div>
    <div class="opps">${order.map(i=>playerPanel(g,i,me)).join('')}</div>
    <div class="table">
      <div class="piles">
        <div class="pile">${pileSvg(g.deck.length)}</div>
        <div class="pilemeta">山札 <b class="num">${g.deck.length}</b>　捨て札 <b class="num">${g.discard.length}</b><br>宝箱の残り <b class="num">${g.bag.length}</b></div>
      </div>
      <div class="stage">${stageHTML(g,me)}</div>
    </div>
    ${me>=0?`<div class="mine">${holdPanel(g,me)}</div>`:''}
    <aside class="log"><h3>航海日誌<small>新しい順</small></h3><ol>${logs}</ol></aside>
  </div></div>`;
  if(prevScroll!==null){const ol=document.querySelector('.log ol');if(ol)ol.scrollTop=prevScroll}
  lastLogN=fresh;
  SFX.scene(true);
}

/* ===== 音の設定パネル ===== */
function sndOpen(){
  const el=document.getElementById('snd');if(!el)return;
  const row=(k,label,vol)=>`<div class="snd-row"><label class="snd-tg"><input type="checkbox" id="snd-${k}" ${SND[k]?'checked':''}><span>${label}</span></label>${vol?`<input type="range" id="snd-${vol}" min="0" max="100" step="5" value="${SND[vol]}" aria-label="${label}の音量"><span class="num snd-v" id="snd-${vol}-v">${SND[vol]}</span>`:'<span></span><span></span>'}</div>`;
  el.innerHTML=`<div class="snd-box" role="dialog" aria-modal="true" aria-labelledby="snd-title">
    <div class="snd-head"><b id="snd-title">音の設定</b><button class="btn small" data-a="sndClose">閉じる</button></div>
    ${row('bgm','BGM','bgmVol')}${row('se','効果音','seVol')}${row('waves','波の音',null)}
    <p class="snd-note">BGMと波の音はゲーム中だけ流れます。設定はこのブラウザに保存されます。</p>
    <p class="snd-credit">${BGM_CREDIT}</p></div>`;
  el.hidden=false;
}
function sndClose(){const el=document.getElementById('snd');if(el){el.hidden=true;el.innerHTML=''}render&&mode!=='home'&&render()}
document.addEventListener('input',e=>{
  const id=e.target.id||'';if(!id.startsWith('snd-'))return;const k=id.slice(4);
  if(e.target.type==='range'){const v=+e.target.value;SFX.set(k,v);const o=document.getElementById(id+'-v');if(o)o.textContent=v}
});
document.addEventListener('change',e=>{
  const id=e.target.id||'';if(!id.startsWith('snd-')||e.target.type!=='checkbox')return;SFX.set(id.slice(4),e.target.checked);
});
/* ===== 入力 ===== */
document.addEventListener('click',e=>{
  if(e.target.closest('#dice')){hideDice();return}
  if(e.target.id==='snd'){sndClose();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const d=b.dataset;
  SFX.unlock();SFX.play('click');
  switch(d.a){
    case 'sndOpen':sndOpen();break;
    case 'sndClose':sndClose();break;
    case 'enter':enterRoom();break;
    case 'local':startLocal();break;
    case 'local-again':L=newGame(L.seats,L.target);lastLogN=0;annClear();lastTurnKey='';prevGold=[];render();scheduleCpu();break;
    case 'leave':if(mode==='local'){mode='home';L=null;clearTimeout(cpuTimer);render()}else leaveRoom();break;
    case 'home':mode='home';roomGone='';render();break;
    case 'fullscreen':
      if(document.fullscreenElement){document.exitFullscreen().catch(()=>{}).finally(render)}
      else{document.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(err){}}).catch(()=>toast('この環境では全画面にできません。')).finally(render)}
      break;
    case 'seat':doOp('seat',{i:+d.i});break;
    case 'kick':doOp('kick',{i:+d.i});break;
    case 'start':doOp('start');break;
    case 'backLobby':doOp('backLobby');break;
    case 'toCpu':doOp('toCpu',{i:+d.i});break;
    case 'draw':perform({type:'draw'});break;
    case 'use':perform({type:'use',opt:d.opt});break;
    case 'raidTarget':perform({type:'raidTarget',t:+d.t});break;
    case 'ghostTarget':perform({type:'ghostTarget',t:+d.t});break;
    case 'scoutTarget':perform({type:'scoutTarget',t:+d.t});break;
    case 'storm':perform({type:'storm',cont:d.cont==='1'});break;
    case 'sellPick':perform({type:'sell',i:+d.i});break;
    case 'toll':perform({type:'toll',how:d.how});break;
    case 'tollGive':perform({type:'tollGive',i:+d.i});break;
    case 'castaway':perform({type:'castaway',rescue:d.rescue==='1'});break;
    case 'raidPick':perform({type:'raidPick',i:+d.i});break;
    case 'deepPick':perform({type:'deepPick',i:+d.i});break;
    case 'chart':perform({type:'chart',swap:d.swap==='1'});break;
    case 'bet':perform({type:'bet',roll:d.roll==='1'});break;
    case 'recruit':perform({type:'recruit',pay:d.pay==='1'});break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='in-target'&&isHost())doOp('target',{v:+e.target.value});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&mode==='home'&&(e.target.id==='in-pass'||e.target.id==='in-name')&&online==='ok'){e.preventDefault();enterRoom()}
});
document.addEventListener('fullscreenchange',()=>{if(mode!=='home')render()});

/* ---- スマホは常に横画面（縦持ちなら画面ごと回転） ---- */
/* 端末そのものの向き（キーボードで画面の高さが縮んでも変わらない） */
function devicePortrait(){try{if(screen.orientation&&screen.orientation.type)return screen.orientation.type.startsWith('portrait')}catch(e){}return screen.height>=screen.width}
/* 文字入力中か（キーボードが出ている間は配置を固定する） */
function typing(){const a=document.activeElement;if(!a)return false;if(a.tagName==='TEXTAREA')return true;return a.tagName==='INPUT'&&!/^(checkbox|range|radio|button|submit)$/.test(a.type)}
function fitScreen(){
  const root0=document.documentElement;
  if(typing()&&root0.classList.contains('land'))return;
  const w=innerWidth,h=innerHeight,short=Math.min(w,h),long=Math.max(w,h);
  const coarse=matchMedia('(pointer:coarse)').matches;
  const phone=short<=560&&(coarse||long<=1000);
  const force=phone&&(coarse?devicePortrait():h>w);
  const land=phone||(w>h&&h<=560);
  const root=document.documentElement;
  root.classList.toggle('land',land);root.classList.toggle('force',force);
  root.style.setProperty('--rw',(force?h:w)+'px');root.style.setProperty('--rh',(force?w:h)+'px');
  root.style.setProperty('--appH',(force?w:h)+'px');
}
fitScreen();
addEventListener('resize',fitScreen);
addEventListener('orientationchange',()=>setTimeout(fitScreen,200));
/* 入力が終わってキーボードが閉じたら、改めて向きを合わせる */
document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing())fitScreen()},350));
/* 回転表示中に入力欄を選んだとき、ブラウザが勝手にずらした表示を戻す */
document.addEventListener('focusin',()=>{if(document.documentElement.classList.contains('force')&&typing())setTimeout(()=>{window.scrollTo(0,0)},60)});

/* ---- 起動：claude.ai なら共有データ、それ以外（GitHub Pages など）なら直接接続 ---- */
(async()=>{
  render();
  const inClaude=!!(window.claude&&window.claude.use);
  if(inClaude){
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u){online='unavailable';render();return}
    myUid=await u.id();
    const cw=await u.can('data.write');
    online=!myUid?'noid':(cw===false?'readonly':'ok');
    if(online==='ok')net=DbNet(d,myUid);
  }else{
    myUid=ssGet('kiri-uid');if(!myUid){myUid='p'+Math.random().toString(36).slice(2,12);ssSet('kiri-uid',myUid)}
    net=PeerNet(myUid);online='ok';
  }
  render();
})();
