<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="共通の山札から宝箱を集めて港で換金する、最大4人のオンライン対戦カードゲーム。合言葉でルームを作り、空いた席にはCPUが入る。">
<meta name="theme-color" content="#1d2f3a">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>霧の果ての海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 航海図の卓。上に航路（港→霧の果て）、左に相手の船、中央に卓と自分の船倉、右に航海日誌。スマホは横3列 */
:root{
  --paper:#dce5e0; --panel:#f1f4ef; --paper-2:#e6ece8; --grid:rgba(29,47,58,.07); --rhumb:rgba(181,67,45,.13);
  --ink:#1d2f3a; --muted:#4b5f6b; --line:#9fb3b3; --soft:#c7d2cf;
  --route:#b5432d; --brass:#c08a1e; --brass-ink:#1b1405;
  --good:#1d6f5f; --bad:#a3361f; --trick:#6b4a96; --cash:#8a5a00;
  --hull:#e8ddc4; --land:#b9ad86; --fog:#f4f7f5;
  --card:#fbfbf7; --card-ink:#1d2f3a; --card-muted:#4b5f6b; --cashopt:#f6e7bd;
  --seat0:#c4432f; --seat1:#2f6fb2; --seat2:#2e8657; --seat3:#c58a10;
  --back:#1f4462; --back-2:#16324a; --back-line:#e7d6a6;
  --shadow:4px 6px 0 rgba(29,47,58,.18);
  --f-display:"Zen Antique Soft","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1b24; --panel:#14262f; --paper-2:#182e39; --grid:rgba(200,225,230,.05); --rhumb:rgba(224,122,95,.12);
  --ink:#d9e5e7; --muted:#8fa5ae; --line:#34505c; --soft:#25404b;
  --route:#e07a5f; --brass:#e9b03a; --brass-ink:#1b1405;
  --good:#4cc2a5; --bad:#ee7d65; --trick:#b195dd; --cash:#f0c25a;
  --hull:#3a3324; --land:#6f6a52; --fog:rgba(220,232,236,.22);
  --card:#f3f4ef; --card-ink:#1d2f3a; --card-muted:#4b5f6b; --cashopt:#f6e7bd;
  --back:#22496a; --back-2:#16324a; --back-line:#e7d6a6;
  --shadow:4px 6px 0 rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1b24; --panel:#14262f; --paper-2:#182e39; --grid:rgba(200,225,230,.05); --rhumb:rgba(224,122,95,.12);
  --ink:#d9e5e7; --muted:#8fa5ae; --line:#34505c; --soft:#25404b;
  --route:#e07a5f; --brass:#e9b03a; --brass-ink:#1b1405;
  --good:#4cc2a5; --bad:#ee7d65; --trick:#b195dd; --cash:#f0c25a;
  --hull:#3a3324; --land:#6f6a52; --fog:rgba(220,232,236,.22);
  --card:#f3f4ef; --card-ink:#1d2f3a; --card-muted:#4b5f6b; --cashopt:#f6e7bd;
  --back:#22496a; --back-2:#16324a; --back-line:#e7d6a6;
  --shadow:4px 6px 0 rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
svg text{font-family:var(--f-body)}

.btn{border:2px solid var(--ink);background:transparent;border-radius:8px;padding:9px 16px;font-weight:700;line-height:1.3;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--paper-2)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--brass)}
.btn.small{padding:5px 10px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:14px 28px}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:24px;max-width:1180px;margin:0 auto}
.hero h1{font-size:clamp(44px,8vw,84px);line-height:1.05;letter-spacing:.02em}
.hero .sub{font-family:var(--f-display);font-size:19px;color:var(--muted);margin:14px 0 22px;max-width:30em}
.compass{width:120px;height:120px;color:var(--ink);opacity:.85;margin-bottom:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
.facts b{color:var(--ink);font-family:var(--f-num)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.panel h2{font-size:24px;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field input,.field select{font:inherit;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.alert{border-left:4px solid var(--bad);padding:8px 12px;background:var(--paper-2);border-radius:4px;font-size:13px;margin-top:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px dashed var(--line)}
details.rules{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{padding-left:1.2em;margin:8px 0;font-size:14px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px;position:relative;z-index:1}
.topbar h1{font-size:26px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:1px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.spacer{flex:1}
.ico-btn{display:inline-flex;align-items:center;gap:6px}
.ico-btn svg{flex:none}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;align-items:start;max-width:1180px}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seat{border:2px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-height:104px;background:var(--panel)}
.seat.filled{border-color:var(--ink)}
.seat.closed{opacity:.5;border-style:dashed}
.seat .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.seat .who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pennant{flex:none}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:0 5px;color:var(--muted);flex:none;line-height:1.6}
.tag.you{color:var(--brass)}
.seat .state{font-size:13px;color:var(--muted)}

/* game: 海図の背景 */
.screen-game{position:relative}
.chartbg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.game{position:relative;z-index:1;display:grid;gap:14px;
  grid-template-columns:250px minmax(0,1fr) 290px;
  grid-template-areas:"route route route" "opps table log" "opps mine log";
  grid-template-rows:auto auto 1fr;align-items:start}
.route{grid-area:route;min-width:0}
.route svg{display:block;width:100%;height:auto}
.opps{grid-area:opps;display:flex;flex-direction:column;gap:12px;min-width:0}
.table{grid-area:table;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start;padding:8px 6px 0}
.mine{grid-area:mine;min-width:0}
.log{grid-area:log}

.pl{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:grid;gap:5px;min-width:0}
.pl.turn{border:2px solid var(--route)}
.pl .head{display:flex;align-items:center;gap:8px;min-width:0}
.pl .head .n{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turnmark{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--route);flex:none}
.gold{display:flex;align-items:baseline;gap:6px}
.gold .g{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1}
.gold .t{font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;color:var(--muted);align-items:center}
.charm{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--good);margin-right:2px;vertical-align:-1px}
.charm.on{background:var(--good)}
.chests{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:24px}
.chests svg{display:block}
.skipnote{font-size:11px;font-weight:700;color:var(--bad)}

/* 卓 */
.piles{display:grid;gap:8px;justify-items:center;padding-top:20px}
.pile svg{display:block;width:104px;height:auto}
.pilemeta{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.pilemeta b{color:var(--ink)}
.stage{display:grid;gap:12px;min-width:0}
.prompt{font-family:var(--f-display);font-size:24px;line-height:1.3}
.prompt small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:2px}
.cards{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cardwrap{display:grid;gap:6px;justify-items:start}
.cardwrap .cap{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.choices{display:flex;flex-wrap:wrap;gap:8px}

.card{width:230px;transform:rotate(-1.5deg);border-radius:12px;background:var(--card);color:var(--card-ink);border:2px solid var(--card-ink);padding:12px 14px 14px;display:grid;gap:8px;box-shadow:var(--shadow)}
.card .kind{font-size:10px;letter-spacing:.14em;font-weight:700;display:flex;justify-content:space-between;color:var(--card-muted)}
.card .title{font-family:var(--f-display);font-size:22px;line-height:1.2;display:flex;align-items:center;gap:8px}
.card .desc{font-size:13px;line-height:1.5}
.card.h{border-color:var(--hc);background:linear-gradient(var(--hc) 0 7px,var(--card) 7px)}
.card.h .kind{color:var(--hc);padding-top:4px}
.card.h.good{--hc:#1d6f5f}.card.h.bad{--hc:#a3361f}.card.h.trick{--hc:#6b4a96}
.opt{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1.5px solid #c9d4d8;text-align:left;background:var(--card);color:var(--card-ink);width:100%}
.opt .on{display:flex;align-items:center;gap:8px}
.opt b{font-family:var(--f-display);font-weight:400;font-size:19px}
.opt span.d{font-size:12px;color:var(--card-muted)}
.opt.cashopt{background:var(--cashopt)}
button.opt{border-color:var(--card-ink);cursor:pointer}
button.opt:hover:not(:disabled){background:#fbe6b0;transform:translateY(-1px)}
.card .opts{display:grid;gap:5px}
.opt.locked{flex-direction:row;align-items:center;gap:6px;opacity:.6;border-style:dashed;padding:4px 9px}
.opt.locked b{font-size:14px;color:#6b7b85}
.opt.locked .need{margin-left:auto;font-size:10px;color:#6b7b85;white-space:nowrap}
.crew{display:inline-flex;gap:1px;vertical-align:-4px}
.awaytag{font-size:10px;font-weight:700;color:var(--cash);border:1px dashed var(--cash);border-radius:4px;padding:0 5px;white-space:nowrap}
.anchortag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#fff;background:#2f6fb2;border-radius:4px;padding:1px 6px;flex:none;white-space:nowrap}
.card.back{background:repeating-linear-gradient(45deg,var(--back) 0 8px,var(--back-2) 8px 16px);border-color:var(--back-2);color:#e8eef0;min-height:150px;place-items:center;text-align:center;font-family:var(--f-display)}
.card.small{width:170px}
.card.small .title{font-size:17px}
.card.small .opt{padding:5px 8px}
.card.small .opt b{font-size:15px}

/* 自分の船倉 */
.hold{border:2px solid var(--ink);border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);padding:12px 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hold.turn{border-color:var(--route);box-shadow:0 0 0 3px color-mix(in srgb,var(--route) 22%,transparent)}
.hold .me{display:flex;flex-direction:column;gap:4px;min-width:140px}
.hold .me .gold .g{font-size:40px}
.hold .bay{flex:1;min-width:240px}
.hold .bay .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.hold .bay svg{display:block;width:100%;max-width:440px;height:auto}

/* 航海日誌 */
.log{border:2px solid var(--ink);border-radius:12px;background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);max-height:calc(100vh - 210px);position:sticky;top:max(12px,env(safe-area-inset-top,0px));min-height:0;overflow:hidden}
.log h3{font-size:18px;padding:8px 14px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.log h3 small{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.log ol{list-style:none;margin:0;padding:0;overflow:auto;font-size:12.5px;display:flex;flex-direction:column-reverse;min-height:0}
.log li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:6px 12px;border-bottom:1px solid var(--soft);line-height:1.5}
.log li .tn{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.log li.good .tx{color:var(--good)}.log li.bad .tx{color:var(--bad)}.log li.trick .tx{color:var(--trick)}
.log li.cash .tx{font-weight:700;color:var(--cash)}.log li.win{background:color-mix(in srgb,var(--brass) 20%,transparent)}.log li.win .tx{font-weight:700}
.log li.sys .tx{color:var(--muted)}
.log li.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--brass) 35%,transparent)}to{background:transparent}}
.winner{border:3px solid var(--brass);border-radius:14px;padding:18px;background:var(--panel);text-align:center;display:grid;gap:10px;justify-items:center;box-shadow:var(--shadow)}
.winner h2{font-size:30px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* 中くらいの画面 */
@media (max-width:1150px){
  .game{grid-template-columns:210px minmax(0,1fr) 250px}
  .card{width:210px}
}
/* タブレット縦など：1列 */
@media (max-width:900px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"route" "opps" "table" "mine" "log";grid-template-rows:none}
  .opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .log{position:static;max-height:300px}
  .lobby,.home{grid-template-columns:minmax(0,1fr)}
}

/* スマホ横画面（縦持ちでも回転して適用）：1画面に3列で収める */
html.land body{font-size:13px;padding-block:4px 0;line-height:1.45}
html.land .topbar{margin-bottom:0;gap:4px 8px}
html.land .topbar h1{font-size:16px}
html.land .chip{font-size:11px;padding:0 8px}
html.land .btn{padding:6px 12px}
html.land .btn.small{padding:2px 8px;font-size:12px}
html.land .btn.big{font-size:15px;padding:8px 18px}
html.land .screen-game{display:flex;flex-direction:column;height:calc(var(--appH,100dvh) - 8px)}
html.land .game{flex:1;min-height:0;gap:6px 8px;
  grid-template-columns:minmax(150px,22%) minmax(0,1fr) minmax(170px,26%);
  grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"route route route" "opps table mine" "opps table log";align-items:stretch}
html.land .opps{display:flex;gap:5px;overflow:auto;min-height:0}
html.land .table{overflow:auto;min-height:0;padding:0 4px;gap:10px;grid-template-columns:auto minmax(0,1fr);align-content:start}
html.land .log{position:static;max-height:none;min-height:0;border-radius:10px;border-width:1.5px}
html.land .log h3{font-size:13px;padding:3px 10px}
html.land .log ol{font-size:11px}
html.land .log li{grid-template-columns:22px minmax(0,1fr);gap:4px;padding:2px 8px}
html.land .log li .tn{font-size:10px}
html.land .pl{padding:4px 8px;gap:1px;border-radius:9px}
html.land .pl .head .n{font-size:13px}
html.land .gold .g{font-size:17px}
html.land .gold .t{font-size:10px}
html.land .chests{min-height:0;gap:2px}
html.land .pl .chests:has(.none){display:none}
html.land .pl .chests svg{width:18px;height:18px}
html.land .stage .chests svg{width:36px;height:36px}
html.land .pl .chests svg.king{width:26px}
html.land .stage .chests svg.king{width:52px}
html.land .meta{font-size:10px;gap:0 8px}
html.land .piles{padding-top:2px;gap:2px}
html.land .pile svg{width:46px}
html.land .pilemeta{font-size:9px;line-height:1.4}
html.land .stage{gap:6px}
html.land .prompt{font-size:15px}
html.land .prompt small{font-size:11px}
html.land .cards{gap:10px;flex-wrap:nowrap}
html.land .cardwrap .cap{font-size:10px}
html.land .card{width:min(170px,48%);min-width:132px;padding:6px 8px 8px;gap:4px;border-radius:9px;box-shadow:2px 3px 0 rgba(29,47,58,.18)}
html.land .card .title{font-size:15px}
html.land .card .desc{font-size:11px}
html.land .card.small{width:130px}
html.land .cardwrap.prev{display:none}
html.land .anchortag .at{display:none}
html.land .anchortag{padding:1px 4px}
html.land .card.act:not(.small){width:min(380px,100%)}
html.land .card.act:not(.small) .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}
html.land .opt.locked{padding:2px 6px}
html.land .opt.locked b{font-size:11px}
html.land .opt.locked .need{font-size:9px}
html.land .crew svg{width:11px;height:13px}
html.land .card.back{min-height:90px}
html.land .opt{padding:4px 7px}
html.land .opt b{font-size:14px}
html.land .opt span.d{font-size:10px;line-height:1.35}
html.land .opt svg{width:20px;height:16px}
html.land .hold{padding:4px 8px;gap:2px 10px;border-radius:10px;border-width:1.5px}
html.land .hold .me{min-width:0;gap:0}
html.land .hold .me .gold .g{font-size:22px}
html.land .hold .bay{min-width:0;flex-basis:100%}
html.land .hold .bay .lab{font-size:9px;margin:0}
html.land .winner{padding:10px}
html.land .winner h2{font-size:20px}
html.land .home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding-top:4px}
html.land .compass{display:none}
html.land .hero h1{font-size:38px}
html.land .hero .sub{font-size:14px;margin:6px 0 10px}
html.land .panel{padding:12px 14px}
html.land .panel h2{font-size:18px;margin-bottom:6px}
html.land .field{margin-bottom:8px;gap:3px}
html.land .field input,html.land .field select{padding:6px 10px}

/* 縦持ちのスマホでは画面ごと90度回して横画面にする */

/* 回転表示では入力欄を、キーボードと反対側（画面の左＝端末の上側）に置く */

html.force #rot{position:fixed;top:0;left:0;width:var(--rw);height:var(--rh);transform-origin:0 0;transform:translateX(var(--rh)) rotate(90deg);overflow:auto;

/* サイコロの演出 */

@keyframes toss{0%{transform:translateY(-110px) scale(.6)}42%{transform:translateY(0) scale(1)}58%{transform:translateY(-26px)}72%{transform:translateY(0)}84%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.die{--s:88px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d}

.face{position:absolute;inset:0;background:#fbf8ef;border:2px solid #1d2f3a;border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;box-shadow:inset 0 0 12px rgba(29,47,58,.2);backface-visibility:hidden}

.f1{transform:translateZ(calc(var(--s)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.dice-shadow{width:80px;height:12px;border-radius:50%;background:rgba(29,47,58,.25);margin-top:-6px;animation:shadow 1.35s ease-out both}

.dice-res{font-size:20px;font-weight:700;min-height:1.6em;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;text-align:center}

html.land .dice-stage{width:110px;height:110px}

/* 音の設定パネル */
#snd{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(14,27,36,.38);padding:16px}
.snd-box{background:var(--panel);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px;width:min(420px,100%);display:grid;gap:10px}
.snd-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-display);font-size:20px}

.snd-tg{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.snd-tg input{width:18px;height:18px;accent-color:var(--route)}
.snd-row input[type=range]{width:100%;accent-color:var(--route)}
.snd-v{text-align:right;font-size:13px;color:var(--muted)}
.snd-note{margin:0;font-size:12px;color:var(--muted)}
.credit{grid-column:1/-1;margin:0;font-size:12px;color:var(--muted)}
.credit a,.snd-credit a{color:inherit}
.snd-credit{margin:0;font-size:12px;color:var(--muted);border-top:1px solid var(--soft);padding-top:8px}

/* 手番の知らせと結果のパネル */
#ann{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:25;pointer-events:none;width:min(560px,calc(100% - 32px))}

#ann.out .ann-box{animation:annOut .25s ease-in both}
@keyframes annIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes annOut{to{opacity:0;transform:translateY(-10px)}}
.ann-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:20px;line-height:1.3}

#ann.turn.me small{color:var(--brass-ink)}
.gold{position:relative}
.delta{position:absolute;left:100%;top:-4px;margin-left:4px;font-family:var(--f-num);font-weight:700;font-size:18px;white-space:nowrap;animation:delta 2.2s ease-out both;pointer-events:none}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
@keyframes delta{0%{opacity:0;transform:translateY(10px) scale(.8)}12%{opacity:1;transform:translateY(0) scale(1.15)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.gold .t{white-space:nowrap}
html.land #ann{top:30px;width:min(440px,calc(100% - 24px))}
html.land .ann-box{padding:6px 12px 8px}
html.land .ann-head{font-size:15px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="rot"><div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div id="dice" hidden></div>
<div id="ann" hidden role="status" aria-live="polite"></div>
<div id="snd" hidden></div></div>

<script id="engine">
/* ===== ルールエンジン（ルールブック試作版に準拠） ===== */
const OPT={
  sail:{n:'航海',d:'宝箱を1個得る'},
  deep:{n:'深海探索',d:'宝箱を2個見て、1個だけ取る'},
  cash:{n:'港で換金',d:'宝箱をすべて開けて金貨にする'},
  raid:{n:'略奪',d:'誰か1人の宝箱を、見ずに1個奪う'},
  chart:{n:'海図を読む',d:'山札の上2枚を見て、並べ替える'},
  repair:{n:'修理',d:'風の護符を1枚得る（最大2）'},
  anchor:{n:'錨を下ろす',d:'次の自分の番まで、宝箱を奪われない・失わない'},
  stormsea:{n:'嵐の海域へ',d:'宝箱を1個ずつ引き上げる。続けるとサイコロ、1で全部失う（最大3個）'},
  sell:{n:'闇の買い取り',d:'伏せて混ぜた自分の宝箱から1つ選び、金貨2枚で売る'},
  dispatch:{n:'船員の出稼ぎ',d:'船員1人が出稼ぎへ。自分の番3回後に金貨2枚を持って戻る'},
  recruit:{n:'船員募集',d:'船員を1人増やす（金貨3で確実、無料なら50%）'}
};
const HAP={
  wreck:{n:'沈没船の発見',c:'good',d:'宝箱を2個得る'},
  dolphins:{n:'イルカの群れ',c:'good',d:'金貨が最も少ない人が宝箱を2個得る'},
  mermaid:{n:'人魚の歌',c:'good',d:'全員、風の護符を1枚得る'},
  storm:{n:'大嵐',c:'bad',d:'全員、宝箱を1個海に捨てる（護符で防げる）'},
  whirlpool:{n:'大渦',c:'bad',d:'自分の宝箱を半分（切り捨て）失う（護符で防げる）'},
  monster:{n:'海の怪物',c:'bad',d:'宝箱を一番多く積んでいる人が2個失う（護符で防げる）'},
  calm:{n:'無風',c:'bad',d:'次の自分の番は休み（護符で防げる）'},
  ghost:{n:'幽霊船',c:'trick',d:'好きな相手1人の宝箱を1個、海に捨てさせる'},
  smuggler:{n:'密輸船',c:'trick',d:'金貨が最も少ない人が、宝箱を一番多く持つ人と宝箱をすべて交換する'},
  tavern:{n:'賭けの酒場',c:'trick',d:'サイコロを振る。偶数で金貨+3、奇数で金貨−2。見送り可'},
  island:{n:'伝説の島',c:'trick',d:'王の宝箱（金貨10）を得る。表向きで、換金するまで奪われうる'},
  crewUp:{n:'新しい仲間',c:'good',d:'港で出会った船乗りが仲間になる。船員+1（最大4人）'},
  crewDown:{n:'船員の離脱',c:'bad',d:'船員が1人、船を降りる（護符で防げる）'},
  scout:{n:'船員の引き抜き',c:'trick',d:'好きな相手1人から船員を1人引き抜く（自分+1、相手−1）'},
  toll:{n:'海賊の通行料',c:'trick',d:'金貨2枚を払う／宝箱を1個差し出す／戦う（サイコロ：偶数で宝箱+1、奇数で宝箱−2）から選ぶ'},
  castaway:{n:'漂流者',c:'trick',d:'助ける（船員+1、食料として宝箱を1個失う）か、見捨てるかを選ぶ'}
};
const HAP_LABEL={good:'良いこと',bad:'悪いこと',trick:'駆け引き'};
/* アクションカードには行動が上から5つ並ぶ。使えるのは上から「船員の数＋1」個まで */
const ACTION_SET=[
  [['sail','cash','recruit','stormsea','raid'],4],
  [['cash','sail','raid','deep','anchor'],4],
  [['sail','raid','repair','cash','recruit'],4],
  [['raid','sail','chart','recruit','cash'],3],
  [['recruit','repair','sail','cash','chart'],3],
  [['repair','recruit','deep','raid','cash'],3],
  [['deep','chart','recruit','cash','anchor'],4],
  [['chart','deep','sell','cash','raid'],2],
  [['cash','raid','deep','recruit','sail'],4],
  [['raid','cash','dispatch','sail','repair'],3],
  [['anchor','repair','raid','dispatch','cash'],2],
  [['sail','anchor','cash','stormsea','recruit'],3],
  [['stormsea','sell','dispatch','sail','cash'],2],
  [['stormsea','sail','cash','raid','repair'],3],
  [['recruit','deep','chart','stormsea','cash'],4],
  [['deep','recruit','anchor','sail','sell'],3],
  [['sell','dispatch','stormsea','recruit','cash'],1],
  [['dispatch','stormsea','recruit','cash','raid'],1],
  [['recruit','sail','raid','cash','deep'],4],
  [['cash','stormsea','anchor','recruit','chart'],4],
  [['sail','recruit','stormsea','cash','raid'],4],
  [['chart','sail','repair','sell','cash'],1]
];
const HAP_SET=[['wreck',3],['dolphins',3],['mermaid',3],['storm',2],['whirlpool',2],['monster',2],['calm',2],['ghost',2],['smuggler',1],['tavern',2],['island',1],['crewUp',3],['crewDown',2],['scout',2],['toll',2],['castaway',2]];
const CHEST_SET=[[1,9],[2,9],[3,7],[5,4],[-2,1]];
const CAP=5, MAXCH=2, MAXCREW=4;
const CPU_NAMES=['カモメ号','黒潮丸','サンゴ号','北風丸'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nm(s,i){return s.seats[i].name}
function log(s,t,c){s.logN=(s.logN||0)+1;s.log.push({t,c:c||'',n:s.logN,tn:s.turnNo});if(s.log.length>60)s.log.splice(0,s.log.length-60)}
function idx(s){return s.P.map((_,i)=>i)}

function newGame(players,target){
  let id=0;const deck=[];
  for(const [o,n] of ACTION_SET)for(let i=0;i<n;i++)deck.push({id:'c'+(id++),t:'a',o});
  for(const [k,n] of HAP_SET)for(let i=0;i<n;i++)deck.push({id:'c'+(id++),t:'h',k});
  const bag=[];let b=0;
  for(const [v,n] of CHEST_SET)for(let i=0;i<n;i++)bag.push({id:'t'+(b++),v});
  const s={target,seats:players,P:players.map(()=>({gold:0,chests:[],charms:0,crew:1,skip:false})),
    deck:shuffle(deck),discard:[],bag:shuffle(bag),turn:Math.floor(Math.random()*players.length),
    phase:'start',cur:null,sub:{},extra:false,log:[],logN:0,winner:null,turnNo:1};
  log(s,`出航！ 金貨${target}枚を先に集めた船長の勝ち。最初は${nm(s,s.turn)}の番。`,'sys');
  return s;
}
function crewOf(p){return p.crew??1}
/* 出稼ぎ中も含めた船員の合計（最大4人の判定に使う） */
function crewTotal(p){return crewOf(p)+(p.away?p.away.length:0)}
/* サイコロの結果を日誌に書く（演出用の情報も付ける） */
function logDice(s,i,v,title,head,res,c){log(s,`サイコロは${v}。${nm(s,i)}は${res}`,c);s.log[s.log.length-1].dice={v,i,title,head,res}}
/* 錨を下ろした船は、次の自分の番まで宝箱を奪われない・失わない */
function safe(s,i){return !!s.P[i].anchor}
function anchorLog(s,i){log(s,`${nm(s,i)}は錨を下ろしていて無事だった。`,'good')}
function avail(s,pi,card){return card.o.slice(0,Math.min(card.o.length,crewOf(s.P[pi])+1))}
function drawCard(s){
  if(!s.deck.length){if(!s.discard.length)return null;s.deck=shuffle(s.discard);s.discard=[];log(s,'山札が尽きたので、捨て札を混ぜ直した。','sys')}
  return s.deck.shift();
}
function ensureDeck(s,n){
  if(s.deck.length<n&&s.discard.length){s.deck=s.deck.concat(shuffle(s.discard));s.discard=[];log(s,'山札が少ないので、捨て札を混ぜて下に加えた。','sys')}
}
function fromBag(s){if(!s.bag.length)return null;return s.bag.splice(Math.floor(Math.random()*s.bag.length),1)[0]}
function toBag(s,c){if(!c.king)s.bag.push(c)}
function loseLowest(s,pi,n){
  const p=s.P[pi];let lost=0;
  for(let k=0;k<n&&p.chests.length;k++){
    let mi=0;p.chests.forEach((c,i)=>{if(c.v<p.chests[mi].v)mi=i});
    const c=p.chests.splice(mi,1)[0];
    if(c.king)log(s,'王の宝箱が海の底へ沈んだ……','bad');
    toBag(s,c);lost++;
  }
  return lost;
}
function giveChest(s,pi,c){
  const p=s.P[pi];p.chests.push(c);
  if(p.chests.length>CAP){loseLowest(s,pi,p.chests.length-CAP);log(s,`${nm(s,pi)}の船が満杯。いちばん安い宝箱を海に捨てた。`,'sys')}
}
function guard(s,pi){
  const p=s.P[pi];
  if(p.charms>0){p.charms--;log(s,`${nm(s,pi)}は風の護符で身を守った。`,'good');return false}
  return true;
}
function minGold(s){const m=Math.min(...s.P.map(p=>p.gold));return idx(s).filter(i=>s.P[i].gold===m)}
function clockwiseFrom(s,start){const n=s.P.length;return Array.from({length:n},(_,k)=>(start+k)%n)}

function resolveHap(s,card){
  const me=s.turn,h=HAP[card.k];
  s.cur=card;
  log(s,`${nm(s,me)}：ハプニング「${h.n}」`,h.c);
  const done=()=>{s.discard.push(card);endTurn(s)};
  switch(card.k){
    case 'wreck':{let g=0;for(let i=0;i<2;i++){const c=fromBag(s);if(c){giveChest(s,me,c);g++}}log(s,`${nm(s,me)}は宝箱を${g}個引き上げた。`);return done()}
    case 'dolphins':{const ids=minGold(s);ids.forEach(i=>{for(let k=0;k<2;k++){const c=fromBag(s);if(c)giveChest(s,i,c)}});log(s,`${ids.map(i=>nm(s,i)).join('、')}が宝箱を2個得た。`,'good');return done()}
    case 'mermaid':s.P.forEach(p=>p.charms=Math.min(MAXCH,p.charms+1));log(s,'全員が風の護符を1枚得た（最大2枚）。','good');return done();
    case 'storm':{let any=false;s.P.forEach((p,i)=>{if(p.chests.length){any=true;if(safe(s,i)){anchorLog(s,i);return}if(guard(s,i)){loseLowest(s,i,1);log(s,`${nm(s,i)}は宝箱を1個失った。`,'bad')}}});if(!any)log(s,'誰も宝箱を積んでいなかった。','sys');return done()}
    case 'whirlpool':{const n=Math.floor(s.P[me].chests.length/2);if(n>0){if(guard(s,me)){loseLowest(s,me,n);log(s,`${nm(s,me)}は宝箱を${n}個失った。`,'bad')}}else log(s,'失う宝箱はなかった。','sys');return done()}
    case 'monster':{const mx=Math.max(...s.P.map(p=>p.chests.length));if(mx>0)s.P.forEach((p,i)=>{if(p.chests.length!==mx)return;if(safe(s,i)){anchorLog(s,i);return}if(guard(s,i)){const l=loseLowest(s,i,2);log(s,`${nm(s,i)}は怪物に宝箱を${l}個奪われた。`,'bad')}});else log(s,'怪物は何も見つけられなかった。','sys');return done()}
    case 'calm':if(guard(s,me)){s.P[me].skip=true;log(s,`${nm(s,me)}は次の番を休む。`,'bad')}return done();
    case 'ghost':{const t=idx(s).filter(i=>i!==me&&s.P[i].chests.length&&!safe(s,i));if(!t.length){log(s,'狙える船がいなかった。','sys');return done()}s.phase='ghostTarget';s.sub={};return}
    case 'smuggler':{
      const poor=minGold(s);const pi=clockwiseFrom(s,me).find(i=>poor.includes(i));
      let best=-1,bc=-1;s.P.forEach((p,i)=>{if(i!==pi&&!safe(s,i)&&p.chests.length>bc){bc=p.chests.length;best=i}});
      if(!safe(s,pi)&&best>=0&&bc>s.P[pi].chests.length){const a=s.P[pi].chests;s.P[pi].chests=s.P[best].chests;s.P[best].chests=a;log(s,`${nm(s,pi)}が${nm(s,best)}と宝箱をすべて交換した！`,'trick')}
      else log(s,`${nm(s,pi)}に得になる交換相手はいなかった。`,'sys');
      return done();
    }
    case 'tavern':s.phase='bet';s.sub={};return;
    case 'toll':s.phase='toll';s.sub={};return;
    case 'castaway':s.phase='castaway';s.sub={};return;
    case 'crewUp':{const p=s.P[me];if(crewTotal(p)<MAXCREW){p.crew=crewOf(p)+1;log(s,`${nm(s,me)}の船に新しい船員が加わった（${p.crew}人）。`,'good')}else log(s,'船員はもう満員だ。','sys');return done()}
    case 'crewDown':{const p=s.P[me];if(crewOf(p)>0){if(guard(s,me)){p.crew=crewOf(p)-1;log(s,`${nm(s,me)}の船員が1人、船を降りた（${p.crew}人）。`,'bad')}}else log(s,'降りる船員がいなかった。','sys');return done()}
    case 'scout':{if(crewTotal(s.P[me])>=MAXCREW){log(s,`${nm(s,me)}の船員はもう満員で、引き抜けなかった。`,'sys');return done()}
      const t=idx(s).filter(i=>i!==me&&crewOf(s.P[i])>0);if(!t.length){log(s,'引き抜ける船員がいなかった。','sys');return done()}
      s.phase='scoutTarget';s.sub={};return}
    case 'island':s.island=true;giveChest(s,me,{id:'king',v:10,king:true});log(s,`${nm(s,me)}が伝説の島で王の宝箱（金貨10）を手に入れた！`,'trick');endTurn(s);return;
  }
}
function checkWin(s){
  const w=idx(s).filter(i=>s.P[i].gold>=s.target);
  if(w.length){w.sort((a,b)=>s.P[b].gold-s.P[a].gold);s.winner=w[0];s.phase='over';log(s,`${nm(s,w[0])}が金貨${s.P[w[0]].gold}枚を集めて勝利！`,'win');return true}
  return false;
}
/* 自分の番が来たとき：錨を上げ、出稼ぎの船員を数える */
function tickTurn(s,n){
  const p=s.P[n];p.anchor=false;
  if(p.away&&p.away.length){
    p.away=p.away.map(x=>x-1);const back=p.away.filter(x=>x<=0).length;p.away=p.away.filter(x=>x>0);
    if(back){p.crew=Math.min(MAXCREW,crewOf(p)+back);p.gold+=2*back;log(s,`${nm(s,n)}の出稼ぎ船員が金貨${2*back}枚を持って戻った（船員${p.crew}人）。`,'good')}
  }
}
function endTurn(s){
  s.sub={};
  if(checkWin(s))return;
  if(s.extra){s.extra=false;s.phase='start';log(s,`追い風！ ${nm(s,s.turn)}がもう一度行動する。`,'good');tickTurn(s,s.turn);checkWin(s);return}
  let n=s.turn;
  for(let g=0;g<s.P.length*2;g++){n=(n+1)%s.P.length;tickTurn(s,n);if(s.P[n].skip){s.P[n].skip=false;log(s,`${nm(s,n)}は無風で1回休み。`,'sys');continue}break}
  s.turn=n;s.phase='start';s.turnNo++;
  checkWin(s);
}
function doOpt(s,opt){
  const me=s.turn,p=s.P[me];
  switch(opt){
    case 'sail':{const c=fromBag(s);if(c)giveChest(s,me,c);log(s,c?`${nm(s,me)}：航海で宝箱を1個得た。`:'宝箱がもう残っていない。');endTurn(s);return true}
    case 'deep':{const o=[fromBag(s),fromBag(s)].filter(Boolean);if(!o.length){log(s,'宝箱がもう残っていない。','sys');endTurn(s);return true}s.sub={opts:o};s.phase='deep';log(s,`${nm(s,me)}：深海探索に潜る。`);return true}
    case 'cash':{const n=p.chests.length;const sum=p.chests.reduce((a,c)=>a+c.v,0);p.chests.forEach(c=>toBag(s,c));p.chests=[];const before=p.gold;p.gold=Math.max(0,p.gold+sum);
      log(s,n?`${nm(s,me)}：港で宝箱${n}個を換金 → 金貨${sum>=0?'+':''}${sum}（計${p.gold}）`:`${nm(s,me)}：港に寄ったが、換金する宝箱がなかった。`,n?'cash':'sys');
      if(p.gold<before)log(s,'呪いの箱が混じっていた！','bad');endTurn(s);return true}
    case 'raid':{const t=idx(s).filter(i=>i!==me&&s.P[i].chests.length&&!safe(s,i));if(!t.length){log(s,`${nm(s,me)}：略奪に出たが、狙える船がいなかった。`,'sys');endTurn(s);return true}s.phase='raidTarget';s.sub={};log(s,`${nm(s,me)}：略奪に向かう。`);return true}
    case 'chart':ensureDeck(s,2);if(s.deck.length<2){log(s,'山札が少なすぎて海図が読めない。','sys');endTurn(s);return true}s.phase='chart';s.sub={};return true;
    case 'recruit':if(crewTotal(p)>=MAXCREW){log(s,`${nm(s,me)}：船員はもう満員だ（${MAXCREW}人）。`,'sys');endTurn(s);return true}s.phase='recruit';s.sub={};log(s,`${nm(s,me)}：船員を募集する。`);return true;
    case 'repair':p.charms=Math.min(MAXCH,p.charms+1);log(s,`${nm(s,me)}：修理して風の護符を得た（${p.charms}枚）。`);endTurn(s);return true;
    case 'stormsea':{const c=fromBag(s);if(!c){log(s,'宝箱がもう残っていない。','sys');endTurn(s);return true}
      s.sub={got:[c]};s.phase='stormsea';log(s,`${nm(s,me)}：嵐の海域へ漕ぎ出し、宝箱を1個引き上げた。`);return true}
    case 'sell':{const ids=p.chests.map((c,i)=>i).filter(i=>!p.chests[i].king);
      if(!ids.length){log(s,`${nm(s,me)}：闇の買い取りに出せる宝箱がなかった。`,'sys');endTurn(s);return true}
      s.sub={order:shuffle(ids.map(i=>p.chests[i].id))};s.phase='sell';log(s,`${nm(s,me)}：宝箱を伏せて混ぜ、闇の買い取りに出す。`);return true}
    case 'dispatch':{if(crewOf(p)<1){log(s,`${nm(s,me)}：出稼ぎに出せる船員がいなかった。`,'sys');endTurn(s);return true}
      p.crew=crewOf(p)-1;p.away=(p.away||[]).concat(3);log(s,`${nm(s,me)}：船員を1人出稼ぎに出した。自分の番3回後に戻る（船員${p.crew}人）。`);endTurn(s);return true}
    case 'anchor':p.anchor=true;log(s,`${nm(s,me)}：錨を下ろした。次の番まで宝箱は守られる。`,'good');endTurn(s);return true;
  }
  return false;
}
/* a: {type,...} 手番プレイヤーの行動。正しくなければ false */
function act(s,a){
  const me=s.turn,p=s.P[me];
  switch(a.type){
    case 'draw':{if(s.phase!=='start')return false;const c=drawCard(s);if(!c){log(s,'山札も捨て札も空っぽだ。','sys');endTurn(s);return true}
      s.cur=c;if(c.t==='h')resolveHap(s,c);else{log(s,`${nm(s,me)}はアクションカードを引いた。`,'sys');s.phase='choose';s.sub={sail:false}}return true}
    case 'use':{if(s.phase!=='choose'||!s.cur||s.cur.t!=='a'||!avail(s,me,s.cur).includes(a.opt))return false;s.discard.push(s.cur);return doOpt(s,a.opt)}
    case 'raidTarget':if(s.phase!=='raidTarget'||a.t===me||!s.P[a.t]||!s.P[a.t].chests.length||safe(s,a.t))return false;s.sub={t:a.t};s.phase='raidPick';return true;
    case 'raidPick':{if(s.phase!=='raidPick')return false;const tp=s.P[s.sub.t];const c=tp.chests[a.i];if(!c)return false;tp.chests.splice(a.i,1);
      log(s,c.king?`${nm(s,me)}が${nm(s,s.sub.t)}から王の宝箱を奪った！`:`${nm(s,me)}が${nm(s,s.sub.t)}から宝箱を1個奪った。`,'trick');giveChest(s,me,c);endTurn(s);return true}
    case 'scoutTarget':{if(s.phase!=='scoutTarget'||a.t===me||!s.P[a.t]||crewOf(s.P[a.t])<1)return false;
      s.P[a.t].crew=crewOf(s.P[a.t])-1;p.crew=Math.min(MAXCREW,crewOf(p)+1);
      log(s,`${nm(s,me)}が${nm(s,a.t)}の船員を1人引き抜いた（${nm(s,me)} ${p.crew}人／${nm(s,a.t)} ${s.P[a.t].crew}人）。`,'trick');s.discard.push(s.cur);endTurn(s);return true}
    case 'ghostTarget':{if(s.phase!=='ghostTarget'||a.t===me||!s.P[a.t]||!s.P[a.t].chests.length||safe(s,a.t))return false;loseLowest(s,a.t,1);
      log(s,`幽霊船が${nm(s,a.t)}の宝箱を1個、海に沈めた。`,'bad');s.discard.push(s.cur);endTurn(s);return true}
    case 'bet':{if(s.phase!=='bet')return false;s.discard.push(s.cur);
      if(!a.roll){log(s,`${nm(s,me)}は賭けを見送った。`,'sys');endTurn(s);return true}
      const d=1+Math.floor(Math.random()*6);s.dice=d;
      if(d%2===0){p.gold+=3;logDice(s,me,d,'賭けの酒場','偶数！',`金貨+3（計${p.gold}）。`,'good')}
      else{p.gold=Math.max(0,p.gold-2);logDice(s,me,d,'賭けの酒場','奇数……',`金貨−2（計${p.gold}）。`,'bad')}
      endTurn(s);return true}
    case 'deepPick':{if(s.phase!=='deep')return false;const o=s.sub.opts;const c=o[a.i];if(!c)return false;o.forEach((x,i)=>{if(i!==a.i)toBag(s,x)});
      giveChest(s,me,c);log(s,`${nm(s,me)}は深海から宝箱を1個引き上げた。`);endTurn(s);return true}
    case 'recruit':{if(s.phase!=='recruit')return false;if(a.pay&&p.gold<3)return false;p.crew=crewOf(p);
      if(a.pay){p.gold-=3;p.crew++;log(s,`${nm(s,me)}は金貨3枚で腕のいい船員を雇った（船員${p.crew}人）。`,'good')}
      else if(Math.random()<0.5){p.crew++;log(s,`${nm(s,me)}の呼びかけに船乗りが応えた（船員${p.crew}人）。`,'good')}
      else log(s,`${nm(s,me)}の呼びかけに、誰も応えなかった。`,'sys');
      endTurn(s);return true}
    case 'storm':{if(s.phase!=='stormsea')return false;const got=s.sub.got;
      if(!a.cont||got.length>=3){got.forEach(c=>giveChest(s,me,c));log(s,`${nm(s,me)}は嵐の海域から宝箱を${got.length}個持ち帰った。`,'good');endTurn(s);return true}
      const d=1+Math.floor(Math.random()*6);
      if(d===1){got.forEach(c=>toBag(s,c));logDice(s,me,d,'嵐の海域','嵐に呑まれた！',`嵐に呑まれ、引き上げた宝箱${got.length}個を失った。`,'bad');endTurn(s);return true}
      const c=fromBag(s);
      if(!c){got.forEach(x=>giveChest(s,me,x));log(s,`宝箱が尽きたので、${got.length}個を持ち帰った。`,'sys');endTurn(s);return true}
      got.push(c);logDice(s,me,d,'嵐の海域','嵐を乗り切った！',`宝箱をもう1個引き上げた（${got.length}個目）。`,'good');
      if(got.length>=3){got.forEach(x=>giveChest(s,me,x));log(s,`${nm(s,me)}は嵐の海域から宝箱を3個持ち帰った。`,'good');endTurn(s)}
      return true}
    case 'sell':{if(s.phase!=='sell')return false;const id=s.sub.order[a.i];if(id==null)return false;const k=p.chests.findIndex(c=>c.id===id);if(k<0)return false;
      const c=p.chests.splice(k,1)[0];toBag(s,c);p.gold+=2;
      log(s,`${nm(s,me)}は闇の買い取りで宝箱を金貨2枚で売った（中身は${c.v<0?'呪いの箱':'金貨'+c.v}だった）。`,c.v<2?'good':(c.v>2?'bad':'cash'));endTurn(s);return true}
    case 'toll':{if(s.phase!=='toll')return false;
      if(a.how==='pay'){if(p.gold<2)return false;p.gold-=2;log(s,`${nm(s,me)}は海賊に金貨2枚を払った。`,'bad');s.discard.push(s.cur);endTurn(s);return true}
      if(a.how==='give'){if(!p.chests.some(c=>!c.king)&&!p.chests.length)return false;s.phase='tollGive';return true}
      if(a.how==='fight'){const d=1+Math.floor(Math.random()*6);s.discard.push(s.cur);
        if(d%2===0){const c=fromBag(s);if(c)giveChest(s,me,c);logDice(s,me,d,'海賊との戦い','勝利！','海賊を追い払い、宝箱を1個奪い取った。','good')}
        else{const lost=[];for(let k=0;k<2&&p.chests.length;k++){const c=p.chests.splice(Math.floor(Math.random()*p.chests.length),1)[0];if(c.king)log(s,'王の宝箱が海賊に奪われた……','bad');toBag(s,c);lost.push(c)}
          logDice(s,me,d,'海賊との戦い','敗北……',`海賊に敗れ、宝箱を${lost.length}個奪われた。`,'bad')}
        endTurn(s);return true}
      return false}
    case 'tollGive':{if(s.phase!=='tollGive')return false;const c=p.chests[a.i];if(!c)return false;p.chests.splice(a.i,1);toBag(s,c);
      log(s,c.king?`${nm(s,me)}は海賊に王の宝箱を差し出した……`:`${nm(s,me)}は海賊に宝箱を1個差し出した。`,'bad');s.discard.push(s.cur);endTurn(s);return true}
    case 'castaway':{if(s.phase!=='castaway')return false;s.discard.push(s.cur);
      if(a.rescue){if(crewTotal(p)>=MAXCREW)return false;p.crew=crewOf(p)+1;const l=loseLowest(s,me,1);
        log(s,`${nm(s,me)}は漂流者を助けた。新しい船員になった（${p.crew}人）${l?'。食料として宝箱を1個失った':''}。`,'good')}
      else log(s,`${nm(s,me)}は漂流者を見捨てた。`,'sys');
      endTurn(s);return true}
    case 'chart':if(s.phase!=='chart')return false;if(a.swap){[s.deck[0],s.deck[1]]=[s.deck[1],s.deck[0]]}log(s,`${nm(s,me)}は海図を読んで、山札の上を整えた。`);endTurn(s);return true;
  }
  return false;
}

/* ===== CPU ===== */
function cpuChoose(s){
  const me=s.turn,p=s.P[me];const opps=idx(s).filter(i=>i!==me);
  const threat=i=>s.P[i].gold+s.P[i].chests.reduce((a,c)=>a+(c.king?10:1.8),0);
  const pickBy=(list,f)=>list.map(i=>[i,f(i)+Math.random()*0.05]).sort((a,b)=>b[1]-a[1])[0][0];
  switch(s.phase){
    case 'choose':{
      const val=p.chests.reduce((a,c)=>a+c.v,0);const full=p.chests.length>=CAP;
      const sc=o=>{let v=0;
        switch(o){
          case 'cash':v=!p.chests.length?-1:(p.gold+val>=s.target?100:(val>=7||p.chests.length>=4||p.chests.some(c=>c.king))?val*1.3:val*0.45);break;
          case 'sail':v=full?0.2:2.6;break;
          case 'deep':v=full?0.3:3.2;break;
          case 'raid':{const t=opps.filter(i=>s.P[i].chests.length&&!safe(s,i));v=t.length?(full?0.6:2.8)+(t.some(i=>s.P[i].chests.some(c=>c.king))?8:0):-1;break}
          case 'repair':v=p.charms===0?2.2:p.charms===1?1.3:-0.5;break;
          case 'chart':v=1.2;break;
          case 'anchor':v=p.chests.some(c=>c.king)?4:p.chests.length>=3?1.4+val*0.2:0.3;break;
          case 'stormsea':v=full?0.2:3.1;break;
          case 'sell':{const cs=p.chests.filter(c=>!c.king);v=cs.length?1.0+(2-cs.reduce((a,c)=>a+c.v,0)/cs.length)*1.2:-1;break}
          case 'dispatch':{const cr=crewOf(p);v=cr>=3?2.8:cr===2?2.2:cr===1?0.9:-1;break}
          case 'recruit':{const cr=crewTotal(p);v=cr>=MAXCREW?-1:cr<=1?3.0:cr===2?2.3:1.5;break}
        }
        return v+Math.random()*0.4;};
      const c=[];
      avail(s,me,s.cur).forEach(o=>c.push({a:{type:'use',opt:o},v:sc(o)}));
      c.sort((x,y)=>y.v-x.v);return c[0].a;
    }
    case 'raidTarget':{const t=opps.filter(i=>s.P[i].chests.length&&!safe(s,i));const k=t.find(i=>s.P[i].chests.some(c=>c.king));return {type:'raidTarget',t:k!==undefined?k:pickBy(t,i=>s.P[i].chests.length*2+s.P[i].gold*0.3)}}
    case 'raidPick':{const ch=s.P[s.sub.t].chests;const k=ch.findIndex(c=>c.king);return {type:'raidPick',i:k>=0?k:Math.floor(Math.random()*ch.length)}}
    case 'ghostTarget':{const t=opps.filter(i=>s.P[i].chests.length&&!safe(s,i));return {type:'ghostTarget',t:pickBy(t,threat)}}
    case 'stormsea':{const n=s.sub.got.length;return {type:'storm',cont:n<3&&(n<2||Math.random()<0.45)}}
    case 'sell':return {type:'sell',i:Math.floor(Math.random()*s.sub.order.length)};
    case 'toll':{const low=p.chests.filter(c=>!c.king).sort((a,b)=>a.v-b.v)[0];
      if(low&&low.v<=1)return {type:'toll',how:'give'};if(p.gold>=2&&p.gold+2<s.target)return {type:'toll',how:'pay'};if(low)return {type:'toll',how:'give'};return {type:'toll',how:'fight'}}
    case 'tollGive':{let bi=-1;p.chests.forEach((c,i)=>{if(!c.king&&(bi<0||c.v<p.chests[bi].v))bi=i});return {type:'tollGive',i:bi<0?0:bi}}
    case 'castaway':{const low=p.chests.filter(c=>!c.king).sort((a,b)=>a.v-b.v)[0];
      return {type:'castaway',rescue:crewTotal(p)<MAXCREW&&(!p.chests.length||crewOf(p)<=1||(low&&low.v<=2))}}
    case 'scoutTarget':{const t=opps.filter(i=>crewOf(s.P[i])>0);return {type:'scoutTarget',t:pickBy(t,i=>crewOf(s.P[i])*10+threat(i))}}
    case 'bet':return {type:'bet',roll:p.gold+3>=s.target||p.gold<=1||Math.random()<0.5};
    case 'recruit':return {type:'recruit',pay:p.gold>=3&&(p.gold>=8||crewOf(p)<=1)};
    case 'deep':{const o=s.sub.opts;let bi=0;o.forEach((c,i)=>{if(c.v>o[bi].v)bi=i});return {type:'deepPick',i:bi}}
    case 'chart':{const rank=c=>c.t==='a'?2:HAP[c.k].c==='bad'?0:HAP[c.k].c==='trick'?1:3;return {type:'chart',swap:rank(s.deck[1])<rank(s.deck[0])}}
  }
  return null;
}
/* CPUの1ステップ：引く → (次のステップで) 行動を最後まで */
function cpuStep(s){
  if(s.phase==='over')return false;
  if(s.phase==='start')return act(s,{type:'draw'});
  let changed=false;
  for(let g=0;g<8&&s.phase!=='start'&&s.phase!=='over';g++){
    const a=cpuChoose(s);if(!a||!act(s,a))break;changed=true;
    if(s.phase==='choose')break;
  }
  return changed;
}
</script>

<script>
/* ===== UI ・ オンライン ===== */
const $app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEATC=['var(--seat0)','var(--seat1)','var(--seat2)','var(--seat3)'];
const TARGETS=[20,30,40],DEF_TARGET=30;
const TAB=Math.random().toString(36).slice(2,10);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}

let online='checking',net=null,myUid=null;

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3600)}

/* ---- 合言葉 → ルームID ---- */
async function roomKey(p){
  const norm=p.normalize('NFKC').trim().toLowerCase();
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kiri:'+norm));
    return 'r'+[...new Uint8Array(buf)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const ch of norm){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return 'r'+h.toString(16)+norm.length}
}

/* ===== ルーム操作（どちらの通信方式でも共通） ===== */
function freshRoom(uid,name){return {v:2,host:uid,status:'lobby',target:DEF_TARGET,seats:[{kind:'human',uid,name},{kind:'empty'},{kind:'empty'},{kind:'empty'}],game:null,seq:1,updatedAt:Date.now()}}
const NOWRITE=new Set([false,'full','spectate']);
function humansLeft(d){return d.seats.some(x=>x.kind==='human')||(d.status==='playing'&&d.game&&d.game.seats.some(x=>x.kind==='human'))}
function passHost(d,uid){if(d.host!==uid)return;const h=d.seats.find(x=>x.kind==='human')||(d.game&&d.game.seats.find(x=>x.kind==='human'));if(h)d.host=h.uid}
function seatToCpu(d,uid,why){
  if(!d.game)return false;const gi=d.game.seats.findIndex(x=>x.uid===uid);if(gi<0)return false;
  const n=d.game.seats[gi].name;d.game.seats[gi]={kind:'cpu',name:n+'（CPU）'};log(d.game,`${n}${why}。CPUが舵を引き継ぐ。`,'sys');return true;
}
const OPS={
  join(d,uid,{name}){
    name=String(name||'船長').slice(0,12);
    if(d.status==='playing')return d.game&&d.game.seats.some(x=>x.uid===uid)?'rejoin':'spectate';
    const i=d.seats.findIndex(x=>x.uid===uid);if(i>=0){d.seats[i].name=name;return 'rejoin'}
    const e=d.seats.findIndex(x=>x.kind==='empty');if(e<0)return 'full';
    d.seats[e]={kind:'human',uid,name};return 'joined';
  },
  leave(d,uid){
    const si=d.seats.findIndex(x=>x.uid===uid);if(si>=0)d.seats[si]={kind:'empty'};
    if(d.status==='playing')seatToCpu(d,uid,'が船を降りた');
    if(!humansLeft(d))return 'delete';
    passHost(d,uid);return true;
  },
  drop(d,uid){ /* 通信が切れた参加者（直接接続方式のみ） */
    const si=d.seats.findIndex(x=>x.uid===uid);if(si>=0)d.seats[si]={kind:'empty'};
    if(d.status==='playing')seatToCpu(d,uid,'との通信が切れた');
    return true;
  },
  seat(d,uid,{i}){if(d.host!==uid||d.status!=='lobby'||!d.seats[i])return false;const s=d.seats[i];
    if(s.kind==='empty')d.seats[i]={kind:'closed'};else if(s.kind==='closed')d.seats[i]={kind:'empty'};else return false;return true},
  kick(d,uid,{i}){if(d.host!==uid||d.status!=='lobby'||!d.seats[i]||d.seats[i].uid===uid||d.seats[i].kind!=='human')return false;d.seats[i]={kind:'empty'};return true},
  target(d,uid,{v}){if(d.host!==uid||d.status!=='lobby'||!TARGETS.includes(v))return false;d.target=v;return true},
  start(d,uid){
    if(d.host!==uid||d.status!=='lobby')return false;
    let ci=0;const players=d.seats.filter(x=>x.kind!=='closed').map(x=>x.kind==='human'?{kind:'human',uid:x.uid,name:x.name}:{kind:'cpu',name:CPU_NAMES[ci++]});
    if(players.length<2)return false;d.game=newGame(players,TARGETS.includes(d.target)?d.target:DEF_TARGET);d.status='playing';return true;
  },
  backLobby(d,uid){if(d.host!==uid||d.status!=='playing')return false;d.status='lobby';d.game=null;if(!TARGETS.includes(d.target))d.target=DEF_TARGET;return true},
  toCpu(d,uid,{i}){if(d.host!==uid||!d.game)return false;const s=d.game.seats[i];if(!s||s.kind!=='human'||s.uid===uid)return false;
    const li=d.seats.findIndex(x=>x.uid===s.uid);if(li>=0)d.seats[li]={kind:'empty'};return seatToCpu(d,s.uid,'の船を交代した')},
  act(d,uid,{a}){const g=d.game;if(!g||d.status!=='playing'||!a||g.seats[g.turn].uid!==uid)return false;return act(g,a)},
  cpu(d,uid,{seq}){if(seq!=null&&d.seq!==seq)return false;if(d.status!=='playing'||!d.game)return false;const g=d.game;if(g.seats[g.turn].kind!=='cpu')return false;return cpuStep(g)}
};

/* ===== 通信方式1：claude.ai の共有データ ===== */
function DbNet(dbx,uid){
  let ref=null,lock=null,unsub=null,timer=null,chain=Promise.resolve();
  async function withLock(fn){
    let ok=false;
    for(let i=0;i<20;i++){
      try{const r=await lock.acquire({holder:uid+':'+TAB,ttlMs:1500});if(r.acquired){ok=true;break}}catch(e){if(e&&e.code==='invalid_argument')throw e}
      await sleep(200+Math.random()*250);
    }
    if(!ok)throw {code:'busy'};
    return fn();
  }
  function mutate(fn){
    const p=chain.then(()=>withLock(async()=>{
      const snap=await ref.get();if(!snap.exists)return false;
      const d=clone(snap.data());const r=fn(d);
      if(NOWRITE.has(r))return r;
      if(r==='delete'){await ref.delete();return r}
      d.seq=(d.seq||0)+1;d.updatedAt=Date.now();await ref.set(d);return r;
    }));
    chain=p.catch(()=>{});return p;
  }
  return {
    kind:'db',uid,
    async join(p,name,cb){
      const rid=await roomKey(p);
      ref=dbx.doc('rooms/'+rid);lock=dbx.doc('rooms/'+rid+'/lock/w');
      const res=await withLock(async()=>{
        const snap=await ref.get();const now=Date.now();
        const d=snap.exists?clone(snap.data()):null;
        if(!d||now-(d.updatedAt||0)>3*3600e3){await ref.set(freshRoom(uid,name));return 'created'}
        const r=OPS.join(d,uid,{name});if(NOWRITE.has(r))return r;
        d.seq=(d.seq||0)+1;d.updatedAt=now;await ref.set(d);return r;
      });
      if(res==='full')return res;
      timer=setTimeout(()=>{if(!room)toast('ルームの情報をまだ受け取れていません。通信を確認してください。')},10000);
      unsub=ref.onSnapshot(snap=>{
        if(!snap.metadata.fromCache)clearTimeout(timer);
        if(!snap.exists){cb.gone('全員が退出したため、ルームはなくなりました。');return}
        cb.room(snap.data());
      },err=>{clearTimeout(timer);handleErr(err)});
      return res;
    },
    op(name,args){return mutate(d=>OPS[name](d,uid,args||{}))},
    async leave(){try{if(room&&!spectator)await mutate(d=>OPS.leave(d,uid))}catch(e){}if(unsub)unsub();unsub=null;clearTimeout(timer)},
    cpuDelay(){return room&&room.host===uid?1000:10000+Math.random()*2000},
    note:''
  };
}

/* ===== 通信方式2：ブラウザ同士の直接接続（GitHub Pages など） ===== */
const PEER_SRC='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
function loadPeerLib(){
  return new Promise((res,rej)=>{
    if(window.Peer)return res();
    const s=document.createElement('script');s.src=PEER_SRC;s.onload=()=>window.Peer?res():rej({code:'lib'});s.onerror=()=>rej({code:'lib'});document.head.appendChild(s);
  });
}
function PeerNet(uid){
  let peer=null,hostConn=null,isHostPeer=false,cb=null,state=null,closing=false;
  const conns=new Set();
  const broadcast=()=>{for(const c of conns)if(c.open){try{c.send({t:'state',room:state})}catch(e){}}};
  const commit=()=>{state.seq++;state.updatedAt=Date.now();cb.room(clone(state));broadcast()};
  function hostApply(name,from,args){
    if(!OPS[name])return false;
    const r=OPS[name](state,from,args||{});
    if(NOWRITE.has(r))return r;
    if(r==='delete')return r;
    commit();return r;
  }
  function openPeer(id){
    return new Promise(res=>{
      const p=id?new Peer(id,{debug:0}):new Peer({debug:0});let done=false;
      const fin=v=>{if(!done){done=true;res(v)}};
      p.on('open',()=>fin({peer:p}));
      p.on('error',e=>fin({peer:p,err:e.type||'error'}));
      setTimeout(()=>fin({peer:p,err:'timeout'}),12000);
    });
  }
  function setupHost(name){
    isHostPeer=true;state=freshRoom(uid,name);
    peer.on('disconnected',()=>{if(!closing){try{peer.reconnect()}catch(e){}}});
    peer.on('connection',c=>{
      conns.add(c);
      c.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.t==='hello'&&!c.uid){
          c.uid=String(m.uid||'').slice(0,40)||('g'+Math.random().toString(36).slice(2));
          const r=OPS.join(state,c.uid,{name:m.name});
          if(r==='full'){try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),400);return}
          if(!NOWRITE.has(r)){state.seq++;state.updatedAt=Date.now();cb.room(clone(state))}
          try{c.send({t:'welcome',res:r,room:state})}catch(e){}
          broadcast();
        }else if(m.t==='op'&&c.uid&&typeof m.name==='string'&&!['cpu','join','drop'].includes(m.name)){
          hostApply(m.name,c.uid,m.args);
        }
      });
      c.on('close',()=>{conns.delete(c);if(closing||!c.uid)return;
        if(![...conns].some(x=>x.uid===c.uid)){if(OPS.drop(state,c.uid))commit()}});
      c.on('error',()=>{});
    });
    cb.room(clone(state));
  }
  function setupClient(key,name){
    return new Promise(resolve=>{
      const c=peer.connect(key,{reliable:true});hostConn=c;let done=false;
      const fin=v=>{if(!done){done=true;clearTimeout(to);resolve(v)}};
      const to=setTimeout(()=>fin({err:'timeout'}),12000);
      peer.on('error',e=>{if(!done)fin({err:e.type||'error'})});
      c.on('open',()=>{try{c.send({t:'hello',uid,name})}catch(e){}});
      c.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.t==='full')fin('full');
        else if(m.t==='welcome'){cb.room(m.room);fin(m.res)}
        else if(m.t==='state'&&done)cb.room(m.room);
      });
      c.on('close',()=>{if(done&&!closing)cb.gone('ホストとの接続が切れました。ホストがページを閉じたか、通信が途切れました。')});
      c.on('error',()=>{});
    });
  }
  return {
    kind:'peer',uid,
    async join(p,name,callbacks){
      cb=callbacks;closing=false;isHostPeer=false;conns.clear();
      await loadPeerLib();
      const key='kirinoumi-'+(await roomKey(p));
      let r=await openPeer(key);peer=r.peer;
      if(!r.err){setupHost(name);return 'created'}
      try{peer.destroy()}catch(e){}
      if(r.err!=='unavailable-id')throw {code:'peer',type:r.err};
      r=await openPeer(null);peer=r.peer;
      if(r.err){try{peer.destroy()}catch(e){}throw {code:'peer',type:r.err}}
      const res=await setupClient(key,name);
      if(res&&res.err){try{peer.destroy()}catch(e){}throw {code:'peer',type:res.err==='peer-unavailable'?'gone':res.err}}
      return res;
    },
    async op(name,args){
      if(isHostPeer){const r=hostApply(name,uid,args);if(r==='delete')cb.gone('ルームを閉じました。');return r}
      if(hostConn&&hostConn.open){hostConn.send({t:'op',name,args:args||{}});return true}
      throw {code:'peer',type:'network'};
    },
    async leave(){
      closing=true;
      try{if(!isHostPeer&&hostConn&&hostConn.open&&!spectator){hostConn.send({t:'op',name:'leave',args:{}});await sleep(250)}}catch(e){}
      try{peer&&peer.destroy()}catch(e){}
      peer=null;hostConn=null;conns.clear();
    },
    cpuDelay(){return isHostPeer?1000:null},
    get isHostPeer(){return isHostPeer},
    note:'インターネット経由でホストのブラウザに直接つなぎます。ホストがページを閉じるとルームは終わります。'
  };
}

function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){online='readonly';toast('書き込みが拒否されました。このページの編集権限が必要です。')}
  else if(c==='busy')toast('ほかの操作と重なりました。もう一度押してください。');
  else if(c==='quota_exceeded')toast('保存領域がいっぱいです。');
  else if(c==='lib')toast('通信用のライブラリを読み込めませんでした。ネットワークを確認してください。');
  else if(c==='peer'){
    const m={gone:'ルームが見つかりませんでした。もう一度試してください。',timeout:'接続がタイムアウトしました。もう一度試してください。',network:'接続サーバーにつながりません。ネットワークを確認してください。','server-error':'接続サーバーが混み合っています。少し待ってから試してください。','socket-error':'接続サーバーにつながりません。','browser-incompatible':'このブラウザは直接接続に対応していません。'};
    toast(m[e.type]||'接続に失敗しました。もう一度試してください。');
  }
  else toast('通信に失敗しました。少し待ってからもう一度押してください。');
}

/* ---- ルームへ入る ---- */
const roomCb={
  room(r){room=r;if(spectator&&room.game&&room.game.seats.some(x=>x.uid===myUid))spectator=false;render();scheduleCpu()},
  gone(msg){if(mode!=='room')return;roomGone=msg;room=null;clearTimeout(cpuTimer);render()}
};
async function enterRoom(){
  if(busy||!net)return;
  const nameEl=document.getElementById('in-name'),passEl=document.getElementById('in-pass');
  const name=(nameEl.value||'').trim().slice(0,12),p=(passEl.value||'').trim();
  if(!name){homeMsg='船長の名前を入れてください。';render();return}
  if(p.length<3){homeMsg='合言葉は3文字以上にしてください。';render();return}
  myName=name;lsSet('kiri-name',name);pass=p;homeMsg='';
  busy=true;mode='room';room=null;roomGone='';spectator=false;render();
  let res;
  try{res=await net.join(p,name,roomCb)}
  catch(e){busy=false;mode='home';handleErr(e);render();return}
  busy=false;
  if(res==='full'){await net.leave();mode='home';room=null;homeMsg='このルームは満席です（最大4人）。';render();return}
  spectator=res==='spectate';
  if(res==='created')toast('新しいルームを開きました。同じ合言葉で仲間が入れます。');
  if(spectator)toast('ゲームが進行中なので、観戦で入りました。');
  render();scheduleCpu();
}
async function leaveRoom(){
  clearTimeout(cpuTimer);
  if(net)await net.leave();
  room=null;mode='home';roomGone='';render();
}
async function doOp(name,args){
  if(busy)return;busy=true;render();
  try{return await net.op(name,args)}catch(e){handleErr(e)}
  finally{busy=false;render()}
}

/* ---- ひとりプレイ ---- */
function startLocal(){
  const name=((document.getElementById('in-name')||{}).value||myName||'').trim().slice(0,12)||'あなた';
  myName=name;lsSet('kiri-name',name);
  const t=+(document.getElementById('in-target-local')||{value:DEF_TARGET}).value;
  L=newGame([{kind:'human',uid:'local',name},...CPU_NAMES.slice(0,3).map(n=>({kind:'cpu',name:n}))],TARGETS.includes(t)?t:DEF_TARGET);
  mode='local';lastLogN=0;render();scheduleCpu();
}

function G(){return mode==='local'?L:(room&&room.status==='playing'?room.game:null)}
function mySeat(g){if(!g)return -1;return g.seats.findIndex(x=>x.uid===(mode==='local'?'local':myUid))}
function isHost(){return mode==='room'&&room&&room.host===myUid}

function perform(a){
  if(mode==='local'){if(L.seats[L.turn].kind!=='human')return;if(act(L,a)){render();scheduleCpu()}return}
  doOp('act',{a});
}
function scheduleCpu(){
  clearTimeout(cpuTimer);
  const g=G();if(!g||g.phase==='over')return;
  if(g.seats[g.turn].kind!=='cpu')return;
  const wait=Math.max(0,diceUntil-Date.now(),ANN.until-Date.now());
  if(mode==='local'){cpuTimer=setTimeout(()=>{if(L&&L.seats[L.turn].kind==='cpu'){cpuStep(L);render();scheduleCpu()}},(g.phase==='start'?650:900)+wait);return}
  if(!net||(spectator&&!isHost()))return;
  let delay=net.cpuDelay();if(delay==null)return;delay+=wait;
  const seq=room.seq;
  cpuTimer=setTimeout(()=>{Promise.resolve(net.op('cpu',{seq})).catch(()=>{})},delay);
}

/* ===== 音（BGM・効果音・波の音）。効果音は Web Audio で合成 ===== */
const BGM_SRC='audio/bgm.mp3';
const BGM_CREDIT='BGM：「サマータイム・アクセル」 <a href="https://musmus.main.jp/" target="_blank" rel="noopener">MusMus</a>';
const SND_DEF={bgm:true,bgmVol:60,se:true,seVol:80,waves:true};
const SND=(()=>{let o={...SND_DEF};try{Object.assign(o,JSON.parse(localStorage.getItem('kiri-snd')||'{}'))}catch(e){}if(lsGet('kiri-sound','1')==='0'&&!lsGet('kiri-snd',''))o.se=false;return o})();
const SFX=(()=>{
  let ctx=null,master=null,seBus=null,bgmBus=null,amb=null,unlocked=false,inGame=false;
  let audio=null,bgmSrc=null,bgmRouted=false,bgmPlaying=false,stopTimer=null;
  function ensure(){
    if(!unlocked)return null;
    if(!ctx){
      try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC();
        master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
        seBus=ctx.createGain();seBus.connect(master);bgmBus=ctx.createGain();bgmBus.gain.value=0;bgmBus.connect(master);applyVol()}catch(e){return null}
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }
  const seLevel=()=>SND.se?0.55*(SND.seVol/100):0;
  const bgmLevel=()=>SND.bgm?Math.pow(SND.bgmVol/100,2)*0.9:0;
  function applyVol(){
    if(!ctx)return;const t=ctx.currentTime;
    seBus.gain.setTargetAtTime(seLevel(),t,0.05);
    if(bgmPlaying)bgmBus.gain.setTargetAtTime(bgmLevel(),t,0.15);
    if(audio&&!bgmRouted)audio.volume=Math.min(1,bgmLevel());
  }
  function tone(f,t0,dur,{type='sine',vol=0.3,slide=0,attack=0.006}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(seBus);o.start(t0);o.stop(t0+dur+0.05);
  }
  let nbuf=null;
  function noiseBuf(){if(!nbuf){const len=ctx.sampleRate*2;nbuf=ctx.createBuffer(1,len,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}return nbuf}
  function noise(t0,dur,{vol=0.3,type='bandpass',freq=1200,q=1,sweep=0}={}){
    const src=ctx.createBufferSource();src.buffer=noiseBuf();
    const f=ctx.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t0);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t0+dur);f.Q.value=q;
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f);f.connect(g);g.connect(seBus);src.start(t0,Math.random()*1.5);src.stop(t0+dur+0.02);
  }
  const S={
    click(t){tone(1100,t,0.05,{type:'triangle',vol:0.05})},
    draw(t){noise(t,0.16,{vol:0.32,type:'highpass',freq:2200,sweep:7000});noise(t+0.05,0.1,{vol:0.15,type:'bandpass',freq:4000,q:2})},
    chest(t){tone(150,t,0.2,{type:'triangle',vol:0.4,slide:0.55});noise(t,0.09,{vol:0.22,type:'lowpass',freq:700})},
    cash(t){[0,0.07,0.13,0.2,0.28,0.37].forEach((d,i)=>{tone(1700+i*190+Math.random()*90,t+d,0.28,{vol:0.16});tone(2700+i*150,t+d,0.12,{type:'triangle',vol:0.05})})},
    good(t){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.09,0.45,{type:'triangle',vol:0.17}))},
    bad(t){tone(98,t,0.7,{type:'sawtooth',vol:0.14,slide:0.5});noise(t,1.1,{vol:0.4,type:'lowpass',freq:600,sweep:110});tone(62,t+0.05,0.6,{vol:0.3,slide:0.7})},
    trick(t){[440,523,622,494].forEach((f,i)=>tone(f,t+i*0.13,0.5,{vol:0.13}));tone(220,t,0.9,{type:'triangle',vol:0.06})},
    raid(t){noise(t,0.22,{vol:0.4,type:'bandpass',freq:1400,q:2,sweep:5000});tone(1500,t+0.17,0.35,{type:'square',vol:0.05,slide:0.92});tone(2250,t+0.17,0.25,{vol:0.05})},
    dice(t){let d=0;for(let i=0;i<15;i++){noise(t+d,0.035,{vol:0.3*(1-i/22),type:'bandpass',freq:2000+Math.random()*2000,q:4});d+=0.045+i*0.007}tone(180,t+1.25,0.12,{type:'triangle',vol:0.25,slide:0.6})},
    bell(t){[0,0.32].forEach(d=>{tone(880,t+d,1.3,{vol:0.18});tone(880*2.76,t+d,0.5,{vol:0.04});tone(440,t+d,0.9,{vol:0.05})})},
    win(t){[392,523,659,784].forEach((f,i)=>tone(f,t+i*0.14,0.32,{type:'triangle',vol:0.2}));[523,659,784,1047].forEach(f=>tone(f,t+0.6,1.4,{type:'triangle',vol:0.12}))}
  };
  function play(n,delay=0){if(!SND.se)return;const c=ensure();if(!c||!S[n])return;try{S[n](c.currentTime+0.01+delay)}catch(e){}}
  /* 航海日誌の新しい行から、いちばん大事な音を1つ（サイコロは結果の前に転がる音） */
  function fromLog(entries){
    let best=null,pri=-1,dice=false;
    for(const e of entries){
      let n=null,p=0;const t=e.t;
      if(e.c==='win'){n='win';p=10}
      else if(t.includes('サイコロ')){dice=true;n=e.c==='good'?'good':'bad';p=7}
      else if(e.c==='cash'){n='cash';p=8}
      else if(t.includes('奪った')){n='raid';p=7}
      else if(e.c==='bad'){n='bad';p=6}
      else if(e.c==='good'){n='good';p=5}
      else if(e.c==='trick'){n='trick';p=5}
      else if(t.includes('宝箱を')&&(t.includes('得た')||t.includes('引き上げた'))){n='chest';p=4}
      else if(t.includes('カードを引いた')){n='draw';p=3}
      if(n&&p>pri){best=n;pri=p}
    }
    if(dice){play('dice');if(best)play(best,1.4)}
    else if(best)play(best);
  }
  /* 波の音（ゲーム中だけ、小さく） */
  function waves(want){
    want=want&&SND.se&&SND.waves;
    if(!want){if(amb){try{amb.src.stop();amb.lfo.stop()}catch(e){}amb=null}return}
    const c=ensure();if(!c||amb)return;
    try{
      const src=c.createBufferSource();src.buffer=noiseBuf();src.loop=true;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
      const g=c.createGain();g.gain.value=0.05;
      const lfo=c.createOscillator();lfo.frequency.value=0.09;const lg=c.createGain();lg.gain.value=0.04;
      lfo.connect(lg);lg.connect(g.gain);
      src.connect(f);f.connect(g);g.connect(seBus);src.start();lfo.start();
      amb={src,lfo};
    }catch(e){}
  }
  /* BGM（ゲーム中だけ。ループ再生、出入りはフェード） */
  function bgm(want){
    want=want&&SND.bgm&&SND.bgmVol>0&&!document.hidden;
    const c=ensure();if(!c)return;
    if(want){
      clearTimeout(stopTimer);
      if(!audio){
        audio=new Audio(BGM_SRC);audio.loop=true;audio.preload='auto';
        try{bgmSrc=c.createMediaElementSource(audio);bgmSrc.connect(bgmBus);bgmRouted=true}catch(e){bgmRouted=false}
      }
      if(!bgmPlaying){
        bgmPlaying=true;bgmBus.gain.cancelScheduledValues(c.currentTime);bgmBus.gain.setValueAtTime(bgmRouted?0.0001:0,c.currentTime);
        if(!bgmRouted)audio.volume=Math.min(1,bgmLevel());
        const pr=audio.play();if(pr&&pr.catch)pr.catch(()=>{bgmPlaying=false});
      }
      if(bgmRouted)bgmBus.gain.setTargetAtTime(bgmLevel(),c.currentTime,0.4);
    }else if(bgmPlaying){
      bgmPlaying=false;bgmBus.gain.setTargetAtTime(0,c.currentTime,0.2);
      clearTimeout(stopTimer);stopTimer=setTimeout(()=>{if(!bgmPlaying&&audio)audio.pause()},900);
    }
  }
  function scene(game){inGame=game;if(!unlocked)return;waves(game);bgm(game)}
  function unlock(){if(unlocked)return;unlocked=true;ensure();scene(inGame)}
  function set(k,v){SND[k]=v;try{localStorage.setItem('kiri-snd',JSON.stringify(SND))}catch(e){}ensure();applyVol();scene(inGame)}
  document.addEventListener('visibilitychange',()=>scene(inGame));
  return {play,fromLog,scene,unlock,set,get anyOn(){return (SND.bgm&&SND.bgmVol>0)||SND.se}};
})();

/* 航路：港 → 霧の果て。各船の金貨の進み具合 */
function routeHTML(g,me){
  const compact=document.documentElement.classList.contains('land');
  const W=1000,H=compact?66:124,x0=78,x1=920,base=compact?44:86,amp=compact?7:22,rise=compact?6:16;
  const T=g.target;
  const yAt=x=>{const t=(x-x0)/(x1-x0);return base-amp*Math.sin(t*Math.PI*1.6)-rise*t};
  const xAt=v=>x0+Math.min(1,v/T)*(x1-x0);
  let d='';for(let x=x0;x<=x1;x+=10)d+=(x===x0?'M':'L')+x+' '+yAt(x).toFixed(1)+' ';
  let ticks='';for(let v=0;v<=T;v+=10){const x=xAt(v);ticks+=`<text x="${x}" y="${H-3}" text-anchor="middle" font-size="${compact?11:12}" style="fill:var(--muted);font-family:var(--f-num)">${v}</text>`;if(v&&v<T)ticks+=`<line x1="${x}" y1="${H-22}" x2="${x}" y2="${H-15}" style="stroke:var(--muted)" stroke-width="1.5"/>`}
  const sc=compact?0.72:1;
  const ships=idx(g).map(i=>({i,x:xAt(g.P[i].gold)})).sort((a,b)=>a.x-b.x);
  ships.forEach((s,k)=>{s.up=!(k%2)||compact});
  const gap=compact?46:46;for(let k=1;k<ships.length;k++){if(ships[k].x-ships[k-1].x<gap)ships[k].x=ships[k-1].x+gap}
  const shipsSvg=ships.map((s,k)=>{
    const i=s.i,y=yAt(s.x)-4,c=SEATC[i%4],turn=g.turn===i&&g.phase!=='over',isMe=i===me;
    const lab=`${esc(nm(g,i))} ${g.P[i].gold}`;
    const ly=compact?(k%2?14:-30):(s.up?-38:24);
    return `<g transform="translate(${s.x.toFixed(1)} ${y.toFixed(1)}) scale(${sc})">
      ${turn?`<circle r="24" cy="-12" fill="none" style="stroke:var(--route)" stroke-width="2" stroke-dasharray="4 3"/>`:''}
      <path d="M-16 0 H16 L11 9 H-11Z" style="fill:var(--ink)"/><path d="M0 0 V-30" style="stroke:var(--ink)" stroke-width="1.8"/>
      <path d="M1 -28 C 14 -22, 14 -10, 1 -4Z" fill="#f6f7f3" style="stroke:var(--ink)" stroke-width="1.2"/><path d="M0 -30 L-14 -26 L0 -22Z" style="fill:${c}"/>
      <text x="0" y="${ly}" text-anchor="middle" font-size="13" font-weight="${isMe||turn?700:500}" style="fill:var(--ink)">${lab}</text></g>`;
  }).join('');
  const port=`<g transform="translate(${x0-62} ${base-30}) scale(${compact?0.7:1})" fill="none" style="stroke:var(--ink)" stroke-width="1.6"><path d="M0 34 H58"/><path d="M8 34 V22 M20 34 V22 M32 34 V22 M44 34 V22"/><path d="M4 22 H48"/><path d="M18 22 V8 L28 0 L38 8 V22" style="fill:var(--paper)"/><path d="M26 22 V14 H30 V22"/></g>`;
  const isl=`<g transform="translate(${x1+6} ${base-(compact?36:58)}) scale(${compact?0.62:1})"><ellipse cx="44" cy="40" rx="70" ry="22" style="fill:var(--fog)"/><path d="M6 44 C 18 18, 34 10, 48 22 C 58 6, 76 14, 86 44Z" style="fill:var(--land);stroke:var(--ink)" stroke-width="1.4"/><path d="M40 22 V2 M40 4 L54 10 L40 14" style="stroke:var(--ink)" stroke-width="1.4" fill="#c08a1e"/><ellipse cx="22" cy="50" rx="60" ry="10" style="fill:var(--fog)"/><ellipse cx="70" cy="56" rx="54" ry="8" style="fill:var(--fog)"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="航路：港から霧の果て（金貨${T}枚）までの各船の進み具合">
    <path d="${d}" fill="none" style="stroke:var(--route)" stroke-width="2" stroke-dasharray="7 6"/>
    ${ticks}${port}${isl}
    <text x="${x0-36}" y="${H-3}" font-size="${compact?11:12}" font-weight="700" style="fill:var(--ink)">港</text>
    ${compact?'':`<text x="${x1+20}" y="16" font-size="14" style="fill:var(--ink);font-family:var(--f-display)">霧の果て</text>`}
    ${shipsSvg}</svg>`;
}

const lockIcon='<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.2" fill="#8a9aa4"/><path d="M3.5 6 V4 a2.5 2.5 0 0 1 5 0 V6" fill="none" stroke="#8a9aa4" stroke-width="1.4"/></svg>';
/* crew を渡すと、上から「船員＋1」個だけ使え、残りは鍵付きで表示 */
function cardHTML(card,{btn,small,crew}={}){
  if(!card)return '';
  if(card.t==='h'){const h=HAP[card.k];
    return `<div class="card h ${h.c} ${small?'small':''}"><div class="kind"><span>ハプニング</span><span>${HAP_LABEL[h.c]}</span></div><div class="title">${hapIcon(h.c)}${h.n}</div><div class="desc">${h.d}</div></div>`}
  const n=crew==null?card.o.length:Math.min(card.o.length,crew+1);
  const opts=card.o.map((o,k)=>{
    if(k>=n)return `<div class="opt locked">${lockIcon}<b>${OPT[o].n}</b><span class="need">船員${k}人で使える</span></div>`;
    const inner=small?`<span class="on">${optIcon(o)}<b>${OPT[o].n}</b></span>`:`<span class="on">${optIcon(o)}<b>${OPT[o].n}</b></span><span class="d">${OPT[o].d}</span>`;
    const cls=`opt ${o==='cash'?'cashopt':''}`;
    return btn?`<button class="${cls}" data-a="use" data-opt="${o}" ${busy?'disabled':''}>${inner}</button>`:`<div class="${cls}">${inner}</div>`;
  }).join('');
  return `<div class="card act ${small?'small':''}"><div class="kind"><span>アクション</span><span>${crew==null?'行動5つ':`${n}つから1つ選ぶ`}</span></div><div class="opts">${opts}</div></div>`;
}
function stageHTML(g,me){

    return `<div class="winner">${pennant(SEATC[w%4],34)}<h2>${esc(nm(g,w))}が霧の果てに着いた</h2><p>金貨 <b class="num">${g.P[w].gold}</b> 枚を集めて勝利。</p>

  }
  if(!mine){
    const W={stormsea:'嵐の海域で宝箱を引き上げています',sell:'闇の買い取りに宝箱を出しています',toll:'海賊への払い方を選んでいます',tollGive:'海賊に差し出す宝箱を選んでいます',castaway:'漂流者を助けるか迷っています',scoutTarget:'船員を引き抜く相手を選んでいます',recruit:'船員を募集しています',start:'カードを引こうとしています',choose:'行動を選んでいます',raidTarget:'略奪する相手を選んでいます',raidPick:'略奪する宝箱を選んでいます',ghostTarget:'幽霊船で狙う相手を選んでいます',bet:'賭けるか迷っています',deep:'深海で宝箱を選んでいます',chart:'海図を読んでいます'};
    let shown='';

      return `<div class="prompt">${an}の番<small>船員${crewOf(p)}人なので、上から${Math.min(5,crewOf(p)+1)}つの行動から1つ選べる。</small></div>

      <div class="choices"><button class="btn primary" data-a="recruit" data-pay="1" ${busy||p.gold<3?'disabled':''}>金貨3枚を払って雇う</button><button class="btn" data-a="recruit" data-pay="0" ${dis}>払わずに声をかける（50%）</button></div>
